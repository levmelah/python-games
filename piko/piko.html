<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פיקו - הצ'אט שלי</title>
<style>
:root { --bg: #212121; --panel: #262626; --field: #2f2f2f; --border: #444; --text: #ececec; --muted: #9a9a9a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; font-size: 15px; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 780px; margin: 0 auto; padding: 10px 16px; gap: 8px; }
.top { display: flex; align-items: center; gap: 8px; }
.spacer { flex: 1; }
button { background: var(--field); color: var(--text); border: 1px solid #555; border-radius: 8px; padding: 6px 14px; font: inherit; cursor: pointer; }
button:hover { background: #3a3a3a; }
button:disabled { background: #3a3a3a; color: #888; cursor: default; }
#send { background: #10a37f; border: none; color: #fff; font-weight: bold; width: 80px; }
#send:hover:not(:disabled) { background: #0e8f6f; }
.small { color: var(--muted); font-size: 12px; }
#keyRow { display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
#keyRow.open { display: flex; }
#keyInput { flex: 1; min-width: 160px; direction: ltr; background: var(--field); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; }
#robot { width: 100%; height: 230px; display: block; background: var(--panel); border-radius: 8px; flex-shrink: 0; }
#mood { text-align: center; font-size: 14px; }
#chat { flex: 1; overflow-y: auto; padding: 8px; min-height: 80px; }
.msg { margin-bottom: 14px; }
.msg b { display: block; margin-bottom: 2px; }
.msg div, .info { white-space: pre-wrap; overflow-wrap: anywhere; }
.info { text-align: center; color: #e57373; margin-bottom: 14px; }
.empty { text-align: center; color: var(--muted); }
.bottom { display: flex; gap: 8px; height: 80px; flex-shrink: 0; }
#entry { flex: 1; resize: none; background: var(--field); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px; font: inherit; }
@media (max-width: 500px) { #robot { height: 180px; } }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button id="newBtn">שיחה חדשה</button>
    <button id="keyBtn">מפתח API</button>
    <span class="spacer"></span>
    <span id="mode" class="small"></span>
  </div>
  <div id="keyRow">
    <span id="keyMsg" class="small">לא חובה. בלי מפתח פיקו עובד במצב בסיסי.</span>
    <input id="keyInput" type="password" placeholder="sk-or-... (OpenRouter) או sk-... (OpenAI)">
    <button id="saveKey">שמור</button>
    <button id="delKey">מחק מפתח</button>
  </div>
  <canvas id="robot"></canvas>
  <div id="mood"></div>
  <div id="chat"></div>
  <div class="bottom">
    <textarea id="entry" placeholder="כתוב הודעה לפיקו..."></textarea>
    <button id="send">שלח</button>
  </div>
</div>

const EMOTIONS = D.EMOTIONS;
const TAG_RE = /^\s*\[\[\s*(\w+)\s*\]\]\s*/;
const MAX_HISTORY = 40;
const KEY_STORE = "piko_key";

const $ = id => document.getElementById(id);
const canvas = $("robot"), ctx = canvas.getContext("2d");
const moodEl = $("mood"), modeEl = $("mode"), chatEl = $("chat"), entry = $("entry"), sendBtn = $("send");

// ---------------------------------------------------------------- הרובוט
const HEAD = "#ff8a65", HEAD_DARK = "#e0643f", FACE = "#fff3e0", INK = "#3e2723", BOLT = "#b0bec5";
const now = () => performance.now() / 1000;
const t0 = now();
let emotion = "neutral", changedAt = now();

function setEmotion(name) {
  if (!(name in EMOTIONS)) name = "neutral";
  if (name !== emotion) { emotion = name; changedAt = now(); }
  moodEl.textContent = "פיקו מרגיש: " + EMOTIONS[emotion].he;
}

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function pen(color, w) { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round"; }
function ell(cx, cy, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(cx, cy, Math.max(rx, 0.01), Math.max(ry, 0.01), 0, 0, Math.PI * 2);
  ctx.fill();
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rrect(x, y, w, h, rx, ry) {
  const P = Math.PI;
  ctx.beginPath();
  ctx.moveTo(x + rx, y);
  ctx.lineTo(x + w - rx, y);
  ctx.ellipse(x + w - rx, y + ry, rx, ry, 0, -P / 2, 0);
  ctx.lineTo(x + w, y + h - ry);
  ctx.ellipse(x + w - rx, y + h - ry, rx, ry, 0, 0, P / 2);
  ctx.lineTo(x + rx, y + h);
  ctx.ellipse(x + rx, y + h - ry, rx, ry, 0, P / 2, P);
  ctx.lineTo(x, y + ry);
  ctx.ellipse(x + rx, y + ry, rx, ry, 0, P, P * 1.5);
  ctx.closePath();
}
function heartPath(cx, cy, s) {
  const p = new Path2D();
  p.moveTo(cx, cy + s * 0.9);
  p.bezierCurveTo(cx - s * 1.4, cy, cx - s * 0.7, cy - s * 1.1, cx, cy - s * 0.35);
  p.bezierCurveTo(cx + s * 0.7, cy - s * 1.1, cx + s * 1.4, cy, cx, cy + s * 0.9);
  return p;
}
function dropPath(cx, cy, s) {
  const p = new Path2D();
  p.moveTo(cx, cy - s);
  p.bezierCurveTo(cx + s * 0.9, cy, cx + s * 0.7, cy + s, cx, cy + s);
  p.bezierCurveTo(cx - s * 0.7, cy + s, cx - s * 0.9, cy, cx, cy - s);
  return p;
}
function starPath(cx, cy, s) {
  const p = new Path2D();
  p.moveTo(cx, cy - s);
  p.quadraticCurveTo(cx, cy, cx + s, cy);
  p.quadraticCurveTo(cx, cy, cx, cy + s);
  p.quadraticCurveTo(cx, cy, cx - s, cy);
  p.quadraticCurveTo(cx, cy, cx, cy - s);
  return p;
}

function paint() {
  const e = EMOTIONS[emotion], t = now() - t0;
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.direction = "ltr";
  ctx.textAlign = "left";

  const s = Math.min(w / 300, h / 225);
  ctx.translate((w - 300 * s) / 2, (h - 225 * s) / 2);
  ctx.scale(s, s);

  // תנועה: נשימה, קפיצה, רעד, וקפיצונת קטנה כשהרגש מתחלף
  let dy = Math.sin(t * 2) * 1.5;
  dy -= Math.abs(Math.sin(t * 6)) * 6 * (e.bounce || 0);
  const pop = Math.max(0, 1 - (now() - changedAt) * 4);
  dy -= Math.sin(pop * Math.PI) * 8;
  const dx = Math.sin(t * 50) * 2.5 * (e.shake || 0);

  ctx.fillStyle = "rgba(0,0,0,0.27)";
  ell(150, 211, 45, 6);

  ctx.translate(dx, dy);
  drawBody(e, t);
  drawHead(e);
  drawEyes(e, t);
  drawBrows(e);
  drawMouth(e, t);
  drawExtra(e, t);
  requestAnimationFrame(paint);
}

function drawBody(e, t) {
  const wave = e.bounce ? Math.sin(t * 8) * 10 : 0;
  pen(HEAD_DARK, 9);
  line(116, 172, 96, 186 - wave);
  line(184, 172, 204, 186 + wave);
  ctx.fillStyle = HEAD_DARK;
  rrect(112, 156, 76, 50, 18, 18);
  ctx.fill();
  pen("#c35736", 2);
  ctx.stroke();
  ctx.fillStyle = e.light;
  ell(150, 182, 8, 8);
}

function drawHead(e) {
  pen(BOLT, 4);
  line(150, 38, 150, 20);
  ctx.fillStyle = rgba(e.light, 0.31);
  ell(150, 15, 12, 12);
  ctx.fillStyle = e.light;
  ell(150, 15, 7, 7);
  ctx.fillStyle = BOLT;
  ell(70, 100, 9, 13);
  ell(230, 100, 9, 13);
  ctx.fillStyle = HEAD;
  rrect(72, 34, 156, 132, 62, 58);
  ctx.fill();
  pen(HEAD_DARK, 3);
  ctx.stroke();
  ctx.fillStyle = FACE;
  ell(150, 104, 60, 49);
  if (e.cheeks) {
    ctx.fillStyle = "rgba(255,120,140,0.43)";
    ell(106, 122, 10, 6);
    ell(194, 122, 10, 6);
  }
}

function drawEyes(e, t) {
  const kind = e.eyes;
  const blink = (t % 3.7) < 0.13 ? 0.1 : 1.0;
  for (const [ex, side] of [[124, -1], [176, 1]]) {
    const ey = 98;
    if (["open", "open_small", "big", "look_up"].includes(kind)) {
      const [rx, ry] = { open: [11, 14], open_small: [9, 11], big: [14, 18], look_up: [11, 14] }[kind];
      const [ox, oy] = kind === "look_up" ? [4, -5] : [0, 0];
      ctx.fillStyle = INK;
      ell(ex + ox, ey + oy, rx, ry * blink);
      if (blink > 0.5) {
        ctx.fillStyle = "#fff";
        ell(ex + ox + rx * 0.35, ey + oy - ry * 0.35, rx * 0.32, rx * 0.32);
      }
    } else if (kind === "happy") {
      pen(INK, 5);
      ctx.beginPath();
      ctx.moveTo(ex - 11, ey + 4);
      ctx.quadraticCurveTo(ex, ey - 12, ex + 11, ey + 4);
      ctx.stroke();
    } else if (kind === "laugh") {
      const d = -side * 8;  // > <
      pen(INK, 5);
      ctx.beginPath();
      ctx.moveTo(ex - d, ey - 8);
      ctx.lineTo(ex + d, ey);
      ctx.lineTo(ex - d, ey + 8);
      ctx.stroke();
    } else if (kind === "heart") {
      const beat = 1 + 0.12 * Math.abs(Math.sin(t * 5));
      ctx.fillStyle = "#e53935";
      ctx.fill(heartPath(ex, ey, 13 * beat));
    } else if (kind === "tiny_pupil") {
      ctx.fillStyle = "#fff";
      ell(ex, ey, 13, 15);
      pen(INK, 3);
      ctx.stroke();
      ctx.fillStyle = INK;
      ell(ex + Math.sin(t * 30), ey, 4, 4);
    } else if (kind === "half") {
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.moveTo(ex - 11, ey);
      ctx.ellipse(ex, ey, 11, 9, 0, Math.PI, 0, true);
      ctx.closePath();
      ctx.fill();
      pen(INK, 3);
      line(ex - 13, ey, ex + 13, ey);
    } else if (kind === "smug") {
      // עפעפיים חצי סגורים ומבט הצידה, כמו "אני יודע שאני מושלם"
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.moveTo(ex - 12, ey - 2);
      ctx.ellipse(ex, ey - 1, 12, 11, 0, Math.PI, 0, true);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#fff";
      ell(ex + 5, ey + 3, 3, 3);
      pen(INK, 3);
      line(ex - 14, ey - 1, ex + 14, ey - 4);
    }
  }
}

function drawBrows(e) {
  const kind = e.brows;
  if (!kind) return;
  pen(INK, 4);
  const by = 74;
  for (const [ex, side] of [[124, -1], [176, 1]]) {
    const inner = ex - side * 11, outer = ex + side * 11;
    if (kind === "angry") line(inner, by + 7, outer, by - 3);
    else if (kind === "sad") line(inner, by - 5, outer, by + 4);
    else if (kind === "up") line(inner, by - 8, outer, by - 6);
    else if (kind === "one_up") {
      if (side === 1) line(inner, by - 6, outer, by - 11);
      else line(inner, by + 1, outer, by + 1);
    }
  }
}

function drawMouth(e, t) {
  const kind = e.mouth, cx = 150, my = 128;
  pen(INK, 4);
  ctx.beginPath();
  if (kind === "smile") {
    ctx.moveTo(cx - 18, my - 3);
    ctx.quadraticCurveTo(cx, my + 14, cx + 18, my - 3);
  } else if (kind === "small_smile") {
    ctx.moveTo(cx - 10, my);
    ctx.quadraticCurveTo(cx, my + 7, cx + 10, my);
  } else if (kind === "frown") {
    ctx.moveTo(cx - 15, my + 7);
    ctx.quadraticCurveTo(cx, my - 6, cx + 15, my + 7);
  } else if (kind === "flat") {
    ctx.moveTo(cx - 10, my + 2);
    ctx.lineTo(cx + 10, my + 2);
  } else if (kind === "smirk") {
    ctx.moveTo(cx - 14, my + 2);
    ctx.quadraticCurveTo(cx + 4, my + 10, cx + 19, my - 6);
  } else if (kind === "side") {
    ctx.moveTo(cx + 2, my + 3);
    ctx.quadraticCurveTo(cx + 12, my + 1, cx + 20, my - 3);
  } else if (kind === "wavy") {
    ctx.moveTo(cx - 16, my + 3);
    for (let i = 0; i < 4; i++) ctx.lineTo(cx - 12 + i * 8, my + (i % 2 === 0 ? -3 : 3));
    ctx.lineTo(cx + 16, my - 1);
  } else if (kind === "o") {
    const r = 8 + Math.sin(t * 4);
    ctx.fillStyle = INK;
    ell(cx, my + 4, r, r * 1.25);
    return;
  } else if (kind === "big") {
    const open = 20 + Math.abs(Math.sin(t * 9)) * 6;
    ctx.moveTo(cx - 20, my - 5);
    ctx.lineTo(cx + 20, my - 5);
    ctx.quadraticCurveTo(cx, my + open, cx - 20, my - 5);
    ctx.fillStyle = INK;
    ctx.fill();
    ctx.fillStyle = "#ef5350";
    ell(cx, my + open * 0.35, 8, 4);
    return;
  }
  ctx.stroke();
}

function drawExtra(e, t) {
  const kind = e.extra;
  if (kind === "hearts") {
    for (let i = 0; i < 3; i++) {
      const ph = (t * 0.5 + i / 3) % 1;
      ctx.fillStyle = rgba("#f06292", 1 - ph);
      ctx.fill(heartPath(235 + i * 10 + Math.sin(t * 3 + i) * 5, 70 - ph * 60, 7));
    }
  } else if (kind === "crown") {
    // כתר זהב עקום על הראש ונצנוצים מסביב
    ctx.save();
    ctx.translate(196, 38);
    ctx.rotate((18 + Math.sin(t * 3) * 4) * Math.PI / 180);
    ctx.beginPath();
    ctx.moveTo(-16, 10);
    for (const [x, y] of [[-16, -6], [-8, 2], [0, -12], [8, 2], [16, -6], [16, 10]]) ctx.lineTo(x, y);
    ctx.closePath();
    ctx.fillStyle = "#ffca28";
    ctx.fill();
    pen("#f9a825", 2);
    ctx.stroke();
    ctx.fillStyle = "#e53935";
    ell(0, 4, 3, 3);
    ctx.fillStyle = "#42a5f5";
    ell(-9, 6, 2, 2);
    ell(9, 6, 2, 2);
    ctx.restore();
    [[88, 48], [238, 92], [100, 160]].forEach(([x, y], i) => {
      ctx.fillStyle = rgba("#fff176", Math.abs(Math.sin(t * 3 + i * 2)));
      ctx.fill(starPath(x, y, 7));
    });
  } else if (kind === "tear") {
    ctx.fillStyle = "rgba(100,181,246,0.86)";
    ctx.fill(dropPath(118, 112 + (t * 22) % 30, 6));
  } else if (kind === "sweat") {
    ctx.fillStyle = "rgba(144,202,249,0.86)";
    ctx.fill(dropPath(212, 60 + Math.sin(t * 3) * 2, 8));
  } else if (kind === "steam") {
    [80, 220].forEach((x, i) => {
      for (let j = 0; j < 3; j++) {
        const ph = (t * 0.8 + j / 3 + i * 0.15) % 1;
        ctx.fillStyle = `rgba(200,200,200,${0.7 * (1 - ph)})`;
        ell(x + Math.sin(t * 4 + j) * 4, 40 - ph * 35, 5 + ph * 6, 5 + ph * 6);
      }
    });
  } else if (kind === "exclaim") {
    ctx.fillStyle = "#ffb74d";
    ctx.font = "bold 40px Arial";
    ctx.fillText("!", 232, 62 - Math.abs(Math.sin(t * 6)) * 6);
  } else if (kind === "question") {
    ctx.fillStyle = "#ba68c8";
    ctx.font = "bold 37px Arial";
    ctx.fillText("?", 232, 60 + Math.sin(t * 3) * 4);
  } else if (kind === "dots") {
    ctx.fillStyle = "#4dd0e1";
    ctx.font = "bold 35px Arial";
    ctx.fillText(".".repeat(Math.floor(t * 3) % 3 + 1), 228, 52);
  } else if (kind === "zzz") {
    ctx.fillStyle = "#90a4ae";
    for (let i = 0; i < 3; i++) {
      const ph = (t * 0.4 + i / 3) % 1;
      ctx.font = `bold ${Math.round((10 + ph * 12) * 1.33)}px Arial`;
      ctx.fillText("z", 222 + ph * 30, 70 - ph * 55);
    }
  }
}

// ---------------------------------------------------------------- המוח של פיקו
const isOpenRouterKey = key => !!key && key.startsWith("sk-or-");
const providerName = key => !key ? "" : (isOpenRouterKey(key) ? "OpenRouter" : "ChatGPT");
const choice = arr => arr[Math.floor(Math.random() * arr.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));

const HTTP_ERRORS = {
  401: "המפתח לא תקין. לחץ על 'מפתח API' והזן מפתח נכון, או מחק אותו כדי לעבוד בלי מפתח.",
  402: "אין מספיק קרדיט בחשבון OpenRouter. אפשר להטעין קרדיט או לבחור מודל חינמי (שנגמר ב-:free).",
  404: "המודל לא נמצא.",
  429: "נגמרה המכסה או שנשלחו יותר מדי בקשות. נסה שוב בעוד רגע.",
};

async function askChat(url, model, messages, extraHeaders) {
  const headers = { "Content-Type": "application/json", "Authorization": "Bearer " + key, ...extraHeaders };
  let resp;
  try {
    resp = await fetch(url, { method: "POST", headers, body: JSON.stringify({ model, messages }) });
  } catch (err) {
    throw new Error("אין חיבור לאינטרנט או לשרת.");
  }
  if (!resp.ok) throw new Error(HTTP_ERRORS[resp.status] || `השרת החזיר שגיאה ${resp.status}`);
  const obj = await resp.json();
  if (obj.error) throw new Error(obj.error.message || String(obj.error));
  const c = (obj.choices || [])[0];
  return (c && c.message && c.message.content) || "";
}

async function ask(messages) {
  if (isOpenRouterKey(key)) {
    modeEl.textContent = "OpenRouter";
    return askChat(D.OPENROUTER_URL, D.OPENROUTER_MODEL, messages, { "X-Title": "PikoChat" });
  }
  if (key) {
    modeEl.textContent = "ChatGPT";
    return askChat(D.OPENAI_URL, D.MODEL, messages, {});
  }
  modeEl.textContent = "מצב בסיסי";
  await sleep(600);
  return simpleBrain(messages[messages.length - 1].content);
}

// מצב בסיסי: מזהה רגש לפי מילים ועונה תשובה מוכנה
function simpleBrain(text) {
  const low = text.toLowerCase();
  let emotion = "neutral";
  for (const [emo, words] of D.RULES) {
    if (words.some(w => low.includes(w))) { emotion = emo; break; }
  }

  const clean = text.trim().split(/\s+/).filter(Boolean).join(" ");
  const words = clean.match(/[\w֐-׿']+/g) || [];
  const topic = words.slice(0, 5).join(" ");
  const wordsSet = new Set(words.map(w => w.toLowerCase()));
  const lowClean = clean.toLowerCase();

  const greetings = ["שלום", "היי", "אהלן", "מה נשמע", "בוקר טוב", "ערב טוב", "לילה טוב"];
  const thanks = ["תודה", "תודה רבה", "מעולה", "מצוין", "אחלה", "יופי"];
  const farewellWords = ["ביי", "בי", "להתראות", "נתראה"];
  const confirmations = ["כן", "לא", "סבבה", "אוקיי", "בסדר", "ברור"];
  const questionWords = ["איך", "מה", "למה", "מתי", "איפה", "מי", "האם", "אפשר"];
  const onlyPunct = clean && !/[\p{L}\p{N}]/u.test(clean);
  const exclamationsOnly = clean && [...clean].every(ch => "! ?".includes(ch));
  const isFarewell = farewellWords.some(w => wordsSet.has(w))
    || lowClean.includes("בי ביי") || lowClean.includes("ביי ביי") || lowClean.includes("להתראות");

  const compliment = ["אתה חכם", "אתה מגניב", "אתה גאון", "אתה הכי"].some(p => low.includes(p));

  let body, kase = null;
  if (!clean) kase = "empty";
  else if (isFarewell) { kase = "farewell"; emotion = "happy"; }
  else if (onlyPunct || exclamationsOnly) kase = "punct";
  else if (compliment) { kase = "compliment"; emotion = "proud"; }
  else if (emotion === "proud") kase = "proud";
  else if (lowClean.includes("מה שלומך") || lowClean.includes("מה נשמע")) kase = "how_are_you";
  else if (greetings.some(g => low.includes(g))) kase = "greeting";
  else if (thanks.some(t => low.includes(t))) kase = "thanks";
  else if (confirmations.includes(clean)) kase = "confirm";
  else if (clean.endsWith("?") && words.length <= 2 && !questionWords.some(w => low.includes(w))) kase = "short_question";
  else if (clean.includes("?") || questionWords.some(w => low.includes(w))) kase = topic ? "question" : "question_no_topic";
  else if (["sad", "angry", "scared"].includes(emotion)) {
    // כשקשה לילד, פיקו עוזב את החוצפה ותומך
    body = choice(D.REPLIES[emotion]) + " אם תרצה, נתקדם יחד צעד אחר צעד.";
  }
  else if (clean.length <= 3) kase = "tiny";
  else if (topic) kase = "topic";
  else kase = "other";

  if (kase) {
    body = choice(D.BASIC_REPLIES[kase]).replaceAll("{topic}", topic);
    if (["neutral", "happy", "confused"].includes(emotion)) emotion = choice(["proud", "proud", "laugh", emotion]);
    if (Math.random() < 0.7) body += " " + choice(D.BASIC_BRAGS);
    if (!["empty", "punct", "farewell"].includes(kase) && Math.random() < 0.3) {
      body = choice(D.BASIC_PRANKS) + " " + body;
      emotion = "laugh";
    }
  }
  return `[[${emotion}]] ${body}`;
}

// ---------------------------------------------------------------- מפתח API
function checkApiKey(key) {
  if (!key) return "לא הוזן מפתח.";
  if (/[^\x00-\x7f]/.test(key)) return "המפתח מכיל תווים שאינם באנגלית. ייתכן שהמקלדת הייתה על עברית.";
  if (!key.startsWith("sk-")) return "מפתח של OpenRouter מתחיל ב-sk-or- (ושל OpenAI ב-sk-). בדוק שהעתקת את כולו.";
  return null;
}

function loadKey() {
  let k = "";
  try { k = (localStorage.getItem(KEY_STORE) || "").trim(); } catch (err) {}
  return k && !checkApiKey(k) ? k : "";
}

let key = loadKey();

$("keyBtn").onclick = () => $("keyRow").classList.toggle("open");
$("saveKey").onclick = () => {
  const k = $("keyInput").value.trim();
  const error = checkApiKey(k);
  if (error) { $("keyMsg").textContent = error; return; }
  try { localStorage.setItem(KEY_STORE, k); } catch (err) {}  // לא נורא, המפתח יעבוד עד שסוגרים את הדף
  key = k;
  $("keyInput").value = "";
  $("keyMsg").textContent = `המפתח נשמר! (${providerName(k)})`;
  modeEl.textContent = providerName(k);
  $("keyRow").classList.remove("open");
};
$("delKey").onclick = () => {
  key = "";
  try { localStorage.removeItem(KEY_STORE); } catch (err) {}
  $("keyMsg").textContent = "המפתח נמחק. פיקו יעבוד בלי מפתח.";
  modeEl.textContent = "";
};

// ---------------------------------------------------------------- הצ'אט
let history = [], display = [], busy = false, lastStyle = null;

function render() {
  chatEl.replaceChildren();
  if (!display.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "כתוב משהו לפיקו ותראה איך הוא מרגיש";
    chatEl.append(p);
  }
  const names = { user: ["אתה", "#8ab4f8"], assistant: ["פיקו", "#ffab91"] };
  for (const [role, text] of display) {
    if (role === "info") {
      const p = document.createElement("div");
      p.className = "info";
      p.textContent = text;
      chatEl.append(p);
      continue;
    }
    const msg = document.createElement("div");
    msg.className = "msg";
    const name = document.createElement("b");
    name.textContent = names[role][0];
    name.style.color = names[role][1];
    const body = document.createElement("div");
    body.textContent = text || "...";
    msg.append(name, body);
    chatEl.append(msg);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function send() {
  if (busy) return;
  const text = entry.value.trim();
  if (!text) return;
  entry.value = "";

  history.push({ role: "user", content: text });
  history = history.slice(-MAX_HISTORY);
  display.push(["user", text], ["assistant", ""]);
  setEmotion("thinking");
  render();

  busy = true;
  sendBtn.disabled = true;
  const style = choice(D.EGO_STYLES.filter(s => s !== lastStyle));
  lastStyle = style;
  const system = D.SYSTEM_PROMPT + "\nסגנון ההתרברבות בתשובה הזו: " + style
    + "\nוזכור: אתה סופר-חוצפן וסופר-אגואיסט! גם בתשובה הזו, עקיצות והתרברבות בכל משפט.";
  try {
    const reply = await ask([{ role: "system", content: system }, ...history]);
    // תגית הרגש בתחילת התשובה משנה את פני הרובוט ולא מוצגת בצ'אט
    const m = reply.match(TAG_RE);
    setEmotion(m ? m[1].toLowerCase() : "neutral");
    display[display.length - 1] = ["assistant", (m ? reply.slice(m[0].length) : reply).trim()];
    if (reply) history.push({ role: "assistant", content: reply });
  } catch (err) {
    history.pop();
    display.pop();
    display.push(["info", "שגיאה: " + err.message]);
    setEmotion("sad");
  }
  render();
  busy = false;
  sendBtn.disabled = false;
  entry.focus();
}

$("newBtn").onclick = () => {
  if (busy) return;
  history = [];
  display = [];
  setEmotion("neutral");
  render();
};
sendBtn.onclick = send;
entry.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    send();
  }
});

modeEl.textContent = providerName(key);
setEmotion("neutral");
render();
entry.focus();
requestAnimationFrame(paint);
</script>
